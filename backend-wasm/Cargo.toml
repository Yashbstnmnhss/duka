[package]
name = "duka-backend-wasm"
description = "Duka runtime for wasm"
authors = ["AogangSolang"]
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
duka-backend = { path = "../backend", default-features = false, features = ["os", "io"] }
duka-gc = { path="../gc" }
serde_json = "1.0.148"