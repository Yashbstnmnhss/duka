[package]
name = "duka-backend-wasm"
description = "Duka runtime for wasm"
authors = ["AogangSolang"]
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["frontend"]
frontend = []

[dependencies]
console_error_panic_hook = "0.1.7"
duka-lib = { path = "../lib", default-features = false }
js-sys = "0.3.107"
serde = "1.0.229"
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.148"
wasm-bindgen = "0.2.130"
