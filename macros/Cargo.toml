[package]
name = "duka-macros"
description = "Macros for duka lib. Do not use them alone"
authors = ["AogangSolang"]
version = "0.1.5"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.95"
proc-macro-crate = "3"
quote = "1.0.40"
syn = { version = "2.0.104", features = ["full", "derive", "extra-traits"] }
