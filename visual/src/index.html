<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Duka Visual Tool</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --primary: #3498db;
                --primary-dark: #2980b9;
                --secondary: #7c3aed;
                --success: #10b981;
                --warning: #f59e0b;
                --danger: #ef4444;
                --dark: #1e293b;
                --light: #f8fafc;
                --gray: #64748b;
                --gray-light: #e2e8f0;
                --border-radius: 10px;
                --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
                --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Inter', sans-serif;
                background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
                color: var(--light);
                min-height: 100vh;
                line-height: 1.6;
            }

            .container {
                max-width: 1400px;
                margin: 0 auto;
                padding: 20px;
            }

            /* 头部样式 */
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                margin-bottom: 30px;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .logo-icon {
                background: linear-gradient(135deg, var(--primary), var(--secondary));
                width: 40px;
                height: 40px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                font-weight: bold;
            }

            .logo-text h1 {
                font-size: 28px;
                font-weight: 700;
                background: linear-gradient(90deg, #60a5fa, #c084fc);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .logo-text p {
                font-size: 14px;
                color: var(--gray);
                margin-top: 2px;
            }

            .stats {
                display: flex;
                gap: 20px;
            }

            .stat-item {
                text-align: center;
            }

            .stat-value {
                font-size: 24px;
                font-weight: 700;
                color: var(--primary);
            }

            .stat-label {
                font-size: 12px;
                color: var(--gray);
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            /* 主内容区域 */
            .main-content {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px;
                margin-bottom: 30px;
            }

            @media (max-width: 1024px) {
                .main-content {
                    grid-template-columns: 1fr;
                }
            }

            .panel {
                background: rgba(30, 41, 59, 0.7);
                border-radius: var(--border-radius);
                border: 1px solid rgba(255, 255, 255, 0.1);
                overflow: hidden;
                box-shadow: var(--shadow);
                backdrop-filter: blur(10px);
            }

            .panel-header {
                padding: 18px 24px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .panel-title {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 18px;
                font-weight: 600;
            }

            .panel-title i {
                color: var(--primary);
            }

            .panel-actions {
                display: flex;
                gap: 10px;
            }

            .panel-body {
                padding: 24px;
            }

            /* 编辑器样式 */
            .editor-container {
                height: 500px;
                position: relative;
            }

            #code-editor {
                width: 100%;
                height: 100%;
                font-family: 'JetBrains Mono', monospace;
                font-size: 14px;
                line-height: 1.5;
                background: #0f172a;
                color: #e2e8f0;
                border: none;
                padding: 20px;
                resize: none;
                border-radius: 0 0 var(--border-radius) var(--border-radius);
                tab-size: 2;
            }
            .output-placeholder {
                text-align: center;
                text-decoration: underline;
            }

            #code-editor:focus {
                outline: none;
            }

            /* 输出区域样式 */
            .output-tabs {
                display: flex;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                margin-bottom: 20px;
            }

            .output-tab {
                padding: 12px 20px;
                background: transparent;
                border: none;
                color: var(--gray);
                font-weight: 500;
                cursor: pointer;
                position: relative;
                transition: all 0.3s;
            }

            .output-tab:hover {
                color: var(--light);
            }

            .output-tab.active {
                color: var(--primary);
            }

            .output-tab.active::after {
                content: '';
                position: absolute;
                bottom: -1px;
                left: 0;
                width: 100%;
                height: 2px;
                background: var(--primary);
            }

            .output-content {
                display: none;
                font-family: 'JetBrains Mono', monospace;
                font-size: 13px;
                line-height: 1.5;
                background: #0f172a;
                border-radius: 8px;
                padding: 20px;
                min-height: 300px;
                max-height: 400px;
                overflow-y: auto;
                white-space: pre-wrap;
                word-break: break-word;
            }

            .output-content.active {
                display: block;
            }

            /* 控制面板样式 */
            .control-panel {
                grid-column: 1 / -1;
                margin-top: 20px;
            }

            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 15px;
                justify-content: center;
            }

            .btn {
                padding: 12px 28px;
                border-radius: 8px;
                border: none;
                font-family: 'Inter', sans-serif;
                font-weight: 600;
                font-size: 16px;
                cursor: pointer;
                transition: all 0.3s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }

            .btn-primary {
                background: linear-gradient(135deg, var(--primary), var(--secondary));
                color: white;
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
            }

            .btn-secondary {
                background: rgba(255, 255, 255, 0.1);
                color: white;
                border: 1px solid rgba(255, 255, 255, 0.2);
            }

            .btn-secondary:hover {
                background: rgba(255, 255, 255, 0.15);
                transform: translateY(-2px);
            }

            .btn-success {
                background: var(--success);
                color: white;
            }

            .btn-warning {
                background: var(--warning);
                color: white;
            }

            .btn-danger {
                background: var(--danger);
                color: white;
            }

            /* 状态指示器 */
            .status-indicator {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 16px;
                background: rgba(30, 41, 59, 0.8);
                border-radius: 50px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                font-size: 14px;
            }

            .status-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--gray);
            }

            .status-dot.active {
                background: var(--success);
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
                100% {
                    opacity: 1;
                }
            }

            /* 语法高亮 */
            .token-keyword {
                color: #ff79c6;
            }
            .token-function {
                color: #50fa7b;
            }
            .token-string {
                color: #f1fa8c;
            }
            .token-comment {
                color: #6272a4;
            }
            .token-number {
                color: #bd93f9;
            }
            .token-type {
                color: #8be9fd;
            }
            .token-operator {
                color: #f8f8f2;
            }

            /* 响应式调整 */
            @media (max-width: 768px) {
                .main-content {
                    gap: 16px;
                }

                .panel-body {
                    padding: 16px;
                }

                .controls {
                    flex-direction: column;
                    align-items: stretch;
                }

                .btn {
                    width: 100%;
                }

                header {
                    flex-direction: column;
                    gap: 20px;
                    text-align: center;
                }

                .stats {
                    width: 100%;
                    justify-content: space-around;
                }
            }

            /* 底部信息 */
            footer {
                text-align: center;
                padding: 30px 0;
                margin-top: 40px;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                color: var(--gray);
                font-size: 14px;
            }

            .footer-links {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 15px;
            }

            .footer-link {
                color: var(--gray);
                text-decoration: none;
                transition: color 0.3s;
            }

            .footer-link:hover {
                color: var(--primary);
            }

            /* 滚动条样式 */
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            ::-webkit-scrollbar-track {
                background: rgba(255, 255, 255, 0.05);
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.2);
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: rgba(255, 255, 255, 0.3);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-code"></i>
                    </div>
                    <div class="logo-text">
                        <h1>Duka Visual Tool</h1>
                    </div>
                </div>

                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="compile-count">0</div>
                        <div class="stat-label">次数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="success-rate">100%</div>
                        <div class="stat-label">无意义的数字</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="session-id">#001</div>
                        <div class="stat-label">无意义的编号</div>
                    </div>
                </div>
            </header>

            <main>
                <div class="main-content">
                    <div class="panel">
                        <div class="panel-header">
                            <div class="panel-title">
                                <i class="fas fa-edit"></i>
                                <span>Editor</span>
                            </div>
                            <div class="panel-actions">
                                <div class="status-indicator">
                                    <div class="status-dot active"></div>
                                    <span>Ready</span>
                                </div>
                                <button class="btn btn-secondary" id="format-btn">
                                    <i class="fas fa-indent"></i>Formatting
                                </button>
                            </div>
                        </div>
                        <div class="panel-body">
                            <div class="editor-container">
                                <textarea id="code-editor"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-header">
                            <div class="panel-title">
                                <i class="fas fa-terminal"></i>
                                <span>Output</span>
                            </div>
                            <div class="panel-actions">
                                <button class="btn btn-secondary" id="clear-output-btn">
                                    <i class="fas fa-trash"></i>Clear
                                </button>
                            </div>
                        </div>
                        <div class="panel-body">
                            <div class="output-tabs">
                                <button class="output-tab active" data-tab="output">Results</button>
                                <button class="output-tab" data-tab="tokens">Tokens</button>
                                <button class="output-tab" data-tab="ast">AST</button>
                                <button class="output-tab" data-tab="ir">IR</button>
                                <button class="output-tab" data-tab="asm">Bytecode</button>
                            </div>

                            <div id="output-tab-content" class="output-content active">
                                <div class="output-placeholder">
                                    <p>NONE</p>
                                </div>
                            </div>

                            <div id="tokens-tab-content" class="output-content">
                                <div class="output-placeholder">
                                    <p>NONE</p>
                                </div>
                            </div>

                            <div id="ast-tab-content" class="output-content">
                                <div class="output-placeholder">
                                    <p>NONE</p>
                                </div>
                            </div>

                            <div id="ir-tab-content" class="output-content">
                                <div class="output-placeholder">
                                    <p>NONE</p>
                                </div>
                            </div>

                            <div id="asm-tab-content" class="output-content">
                                <div class="output-placeholder">
                                    <p>NONE</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 控制面板 -->
                    <div class="panel control-panel">
                        <div class="panel-header">
                            <div class="panel-title">
                                <i class="fas fa-sliders-h"></i>
                                <span>Actions</span>
                            </div>
                        </div>
                        <div class="panel-body">
                            <div class="controls">
                                <button class="btn btn-primary" id="compile-btn">
                                    <i class="fas fa-play-circle"></i>编译并执行
                                </button>
                                <button class="btn btn-secondary" id="lexical-btn">
                                    <i class="fas fa-stream"></i>词法分析
                                </button>
                                <button class="btn btn-secondary" id="syntax-btn">
                                    <i class="fas fa-project-diagram"></i>语法分析
                                </button>
                                <button class="btn btn-secondary" id="ir-btn">
                                    <i class="fas fa-code"></i>生成中间表示(IR)
                                </button>
                                <button class="btn btn-secondary" id="asm-btn">
                                    <i class="fas fa-microchip"></i>生成字节码
                                </button>
                                <button class="btn btn-warning" id="reset-btn">
                                    <i class="fas fa-redo"></i>重置
                                </button>
                            </div>

                            <div
                                style="
                                    margin-top: 25px;
                                    display: flex;
                                    flex-wrap: wrap;
                                    gap: 20px;
                                    justify-content: center;
                                "
                            >
                                <div class="compiler-option">
                                    <label
                                        style="display: block; margin-bottom: 8px; font-weight: 500"
                                    >
                                        <input type="checkbox" id="optimize-checkbox" checked />
                                        开启优化
                                    </label>
                                </div>
                                <div class="compiler-option">
                                    <label
                                        style="display: block; margin-bottom: 8px; font-weight: 500"
                                    >
                                        <input type="checkbox" id="warnings-checkbox" checked />
                                        显示警告
                                    </label>
                                </div>
                                <div class="compiler-option">
                                    <label
                                        style="display: block; margin-bottom: 8px; font-weight: 500"
                                    >
                                        <select
                                            id="target-select"
                                            style="
                                                background: rgba(255, 255, 255, 0.1);
                                                border: 1px solid rgba(255, 255, 255, 0.2);
                                                color: white;
                                                padding: 8px 12px;
                                                border-radius: 6px;
                                                width: 180px;
                                            "
                                        >
                                            <option value="default">Default</option>
                                        </select>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <footer>
                <p>Duka Visual Tool</p>
                <div class="footer-links">
                    <a
                        href="https://github.com/Yashbstnmnhss/duka"
                        class="footer-link"
                        id="github-link"
                    >
                        <i class="fab fa-github"> </i>
                        GitHub
                    </a>
                    <!-- <a href="#" class="footer-link" id="docs-link">
                        <i class="fas fa-book"></i> 文档
                    </a>
                    <a href="#" class="footer-link" id="issues-link">
                        <i class="fas fa-bug"></i> 报告问题
                    </a> -->
                </div>
                <p style="margin-top: 15px; font-size: 12px; opacity: 0.7">AogangSolang</p>
            </footer>
        </div>

        <script>
            let compileCount = 0
            let successCount = 0
            let currentSessionId = 1
            let isCompiling = false

            const codeEditor = document.getElementById('code-editor')
            const compileBtn = document.getElementById('compile-btn')
            const lexicalBtn = document.getElementById('lexical-btn')
            const syntaxBtn = document.getElementById('syntax-btn')
            const irBtn = document.getElementById('ir-btn')
            const asmBtn = document.getElementById('asm-btn')
            const resetBtn = document.getElementById('reset-btn')
            const formatBtn = document.getElementById('format-btn')
            const clearOutputBtn = document.getElementById('clear-output-btn')
            const outputTabs = document.querySelectorAll('.output-tab')
            const outputContents = document.querySelectorAll('.output-content')
            const compileCountElement = document.getElementById('compile-count')
            const successRateElement = document.getElementById('success-rate')
            const sessionIdElement = document.getElementById('session-id')
            const optimizeCheckbox = document.getElementById('optimize-checkbox')
            const warningsCheckbox = document.getElementById('warnings-checkbox')
            const targetSelect = document.getElementById('target-select')

            const exampleCodes = {
                defines: `
local a, b = ...
            `,
            }

            async function compile(input, step) {
                const res = await fetch('/do', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        kind: step,
                        code: input,
                    }),
                })
                return await res.json()
            }

            function init() {
                updateStats()

                sessionIdElement.textContent = `#${currentSessionId.toString().padStart(3, '0')}`

                compileBtn.addEventListener('click', handleCompile)
                lexicalBtn.addEventListener('click', handleLexicalAnalysis)
                syntaxBtn.addEventListener('click', handleSyntaxAnalysis)
                irBtn.addEventListener('click', handleIRGeneration)
                asmBtn.addEventListener('click', handleAssemblyGeneration)
                resetBtn.addEventListener('click', handleReset)
                formatBtn.addEventListener('click', handleFormat)
                clearOutputBtn.addEventListener('click', handleClearOutput)

                outputTabs.forEach(tab => {
                    tab.addEventListener('click', () => {
                        const tabId = tab.getAttribute('data-tab')
                        switchTab(tabId)
                    })
                })
                showMessage('Duka Visual Tool 就绪')
            }

            function updateStats() {
                compileCountElement.textContent = compileCount
                const successRate =
                    compileCount > 0 ? Math.round((successCount / compileCount) * 100) : 100
                successRateElement.textContent = `${successRate}%`
            }

            function switchTab(tabId) {
                outputTabs.forEach(tab => tab.classList.remove('active'))
                outputContents.forEach(content => content.classList.remove('active'))

                document.querySelector(`.output-tab[data-tab="${tabId}"]`).classList.add('active')
                document.getElementById(`${tabId}-tab-content`).classList.add('active')
            }

            function handleCompile() {
                if (isCompiling) return

                const code = codeEditor.value.trim()
                if (!code) {
                    showError('Empty')
                    return
                }

                isCompiling = true
                compileCount++
                currentSessionId++

                compileBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>编译中...'
                compileBtn.disabled = true

                setTimeout(() => {
                    const success = Math.random() > 0.1

                    if (success) {
                        successCount++
                        compileOk(code)
                    } else {
                        compileErr(code)
                    }

                    updateStats()
                    sessionIdElement.textContent = `#${currentSessionId.toString().padStart(3, '0')}`

                    compileBtn.innerHTML = '<i class="fas fa-play-circle"></i>编译并执行'
                    compileBtn.disabled = false
                    isCompiling = false

                    switchTab('output')
                }, 800)
            }

            function compileOk(code) {
                const optimization = optimizeCheckbox.checked ? '启用' : '禁用'
                const target = targetSelect.value
                const warnings = warningsCheckbox.checked

                let output = `编译会话 #${currentSessionId.toString().padStart(3, '0')}\n`
                output += `${new Date().toLocaleString()}\n`
                output += `编译成功!\n\n`
                output += `编译统计:\n`
                output += `   代码行数: ${code.split('\n').length}\n`
                output += `   文件大小: ${new Blob([code]).size} 字节\n\n`

                setOutputContent('output', output)
                showMessage('Result::Ok')
            }

            function compileErr(code) {
                let errorOutput = `编译会话 #${currentSessionId.toString().padStart(3, '0')}\n`
                errorOutput += `${new Date().toLocaleString()}\n\n`
                errorOutput += `编译失败\n\n`
                errorOutput += `错误信息:\n`

                setOutputContent('output', errorOutput)
                showError('Result::Err')
            }

            function handleLexicalAnalysis() {
                const code = codeEditor.value.trim()
                if (!code) {
                    showError('Empty')
                    return
                }

                compile(code, 'lexical')
                    .then(response => {
                        if (response.status === 'success') {
                            const tokens = response.tokens.join('\n')
                            setOutputContent('tokens', tokens)
                            showMessage(`词法分析完成，共 ${response.count} 个 token`)
                        } else {
                            showError(response.message || '词法分析失败')
                        }
                    })
                    .catch(err => {
                        showError('词法分析请求失败')
                    })
                switchTab('tokens')
            }

            function handleSyntaxAnalysis() {
                const code = codeEditor.value.trim()
                if (!code) {
                    showError('Empty')
                    return
                }

                compile(code, 'syntax')
                    .then(response => {
                        if (response.status === 'success') {
                            const ast = JSON.stringify(response.ast, null, 2)
                            setOutputContent('ast', ast)
                            showMessage(`语法分析完成`)
                        } else {
                            showError(response.message || '语法分析失败')
                        }
                    })
                    .catch(err => {
                        showError('语法分析请求失败')
                    })
                switchTab('ast')
            }

            function handleIRGeneration() {
                const code = codeEditor.value.trim()
                if (!code) {
                    showError('Empty')
                    return
                }

                compile(code, 'ir')
                    .then(response => {
                        if (response.status === 'success') {
                            const ir = response.ir
                            setOutputContent('ir', ir)
                            showMessage(`IR 生成完成`)
                        } else {
                            showError(response.message || 'IR 生成失败')
                        }
                    })
                    .catch(err => {
                        showError('IR 生成请求失败 ' + err)
                    })
                switchTab('ir')
            }

            function handleAssemblyGeneration() {
                const code = codeEditor.value.trim()
                if (!code) {
                    showError('Empty')
                    return
                }

                compile(code, 'asm')
                    .then(response => {
                        if (response.status === 'success') {
                            const asm = response.bytecode.join('\n')
                            setOutputContent('asm', asm)
                            showMessage(`字节码生成完成，共 ${response.instruction_count} 条指令`)
                        } else {
                            showError(response.message || '字节码生成失败')
                        }
                    })
                    .catch(err => {
                        showError('字节码生成请求失败')
                    })
                switchTab('asm')
            }

            function handleReset() {
                if (confirm('确定重置?')) {
                    codeEditor.value = exampleCodes.defines
                    compileCount = 0
                    successCount = 0
                    currentSessionId = 1

                    const outputIds = ['output', 'tokens', 'ast', 'ir', 'asm']
                    outputIds.forEach(id => {
                        const element = document.getElementById(`${id}-tab-content`)
                        element.innerHTML = `<div class="output-placeholder">
                        <p>None</p>
                    </div>`
                    })

                    switchTab('output')

                    updateStats()
                    sessionIdElement.textContent = `#${currentSessionId.toString().padStart(3, '0')}`
                    showMessage('已重置')
                }
            }

            function handleClearOutput() {
                const activeTab = document
                    .querySelector('.output-tab.active')
                    .getAttribute('data-tab')
                const element = document.getElementById(`${activeTab}-tab-content`)
                element.innerHTML = `<div class="output-placeholder">
                <p>NONE</p>
            </div>`

                showMessage(`已清除${activeTab}输出`)
            }

            function setOutputContent(tabId, content) {
                const element = document.getElementById(`${tabId}-tab-content`)
                element.innerHTML = `<pre>${content}</pre>`
            }

            function debounce(func, wait) {
                let timeout
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout)
                        func(...args)
                    }
                    clearTimeout(timeout)
                    timeout = setTimeout(later, wait)
                }
            }

            function showMessage(message) {
                const statusInd = document.querySelector('.status-indicator')
                const statusDot = document.querySelector('.status-dot')
                const statusText = statusInd.querySelector('span:nth-child(2)')

                statusDot.className = 'status-dot active'
                statusText.textContent = message

                setTimeout(() => {
                    statusText.textContent = '编译器就绪'
                }, 5000)
            }

            function showError(message) {
                const statusInd = document.querySelector('.status-indicator')
                const statusDot = document.querySelector('.status-dot')
                const statusText = statusInd.querySelector('span:nth-child(2)')

                statusDot.className = 'status-dot'
                statusDot.style.background = 'var(--danger)'
                statusText.textContent = message

                setTimeout(() => {
                    statusDot.style.background = ''
                    statusDot.className = 'status-dot active'
                    statusText.textContent = '编译器就绪'
                }, 3000)
            }

            window.addEventListener('DOMContentLoaded', init)
        </script>
    </body>
</html>
