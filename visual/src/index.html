<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Duka Visual Tool</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="
https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css
"
            rel="stylesheet"
        />
        <style>
            :root {
                --primary: #3498db;
                --primary-dark: #2980b9;
                --secondary: #7c3aed;
                --success: #10b981;
                --warning: #f59e0b;
                --danger: #ef4444;
                --dark: #1e293b;
                --light: #f8fafc;
                --gray: #64748b;
                --gray-light: #e2e8f0;
                --border-radius: 10px;
                --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
                --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Inter', sans-serif;
                background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
                color: var(--light);
                min-height: 100vh;
                line-height: 1.6;
            }

            .container {
                max-width: 1400px;
                margin: 0 auto;
                padding: 20px;
            }

            /* 头部样式 */
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                margin-bottom: 30px;
            }

            .logo {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .logo-icon {
                background: linear-gradient(135deg, var(--primary), var(--secondary));
                width: 40px;
                height: 40px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                font-weight: bold;
            }

            .logo-text h1 {
                font-size: 28px;
                font-weight: 700;
                background: linear-gradient(90deg, #60a5fa, #c084fc);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .logo-text p {
                font-size: 14px;
                color: var(--gray);
                margin-top: 2px;
            }

            .stats {
                display: flex;
                gap: 20px;
            }

            .stat-item {
                text-align: center;
            }

            .stat-value {
                font-size: 24px;
                font-weight: 700;
                color: var(--primary);
            }

            .stat-label {
                font-size: 12px;
                color: var(--gray);
                text-transform: uppercase;
                letter-spacing: 1px;
            }

            /* 主内容区域 */
            .main-content {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px;
                margin-bottom: 30px;
            }

            @media (max-width: 1024px) {
                .main-content {
                    grid-template-columns: 1fr;
                }
            }

            .panel {
                background: rgba(30, 41, 59, 0.7);
                border-radius: var(--border-radius);
                border: 1px solid rgba(255, 255, 255, 0.1);
                overflow: hidden;
                box-shadow: var(--shadow);
                backdrop-filter: blur(10px);
            }

            .panel-header {
                padding: 18px 24px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .panel-title {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 18px;
                font-weight: 600;
            }

            .panel-title i {
                color: var(--primary);
            }

            .panel-actions {
                display: flex;
                gap: 10px;
            }

            .panel-body {
                padding: 24px;
            }

            /* 编辑器样式 */
            .editor-container {
                font-size: 1.25rem;
                height: 500px;
                position: relative;
            }

            .output-placeholder {
                text-align: center;
                text-decoration: underline;
            }


            /* 输出区域样式 */
            .output-tabs {
                display: flex;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                margin-bottom: 20px;
            }

            .output-tab {
                padding: 12px 20px;
                background: transparent;
                border: none;
                color: var(--gray);
                font-weight: 500;
                cursor: pointer;
                position: relative;
                transition: all 0.3s;
            }

            .output-tab:hover {
                color: var(--light);
            }

            .output-tab.active {
                color: var(--primary);
            }

            .output-tab.active::after {
                content: '';
                position: absolute;
                bottom: -1px;
                left: 0;
                width: 100%;
                height: 2px;
                background: var(--primary);
            }

            .output-content {
                display: none;
                font-family: 'JetBrains Mono', monospace;
                font-size: 1rem;
                line-height: 1.5;
                background: #0f172a;
                border-radius: 8px;
                padding: 20px;
                min-height: 300px;
                max-height: 400px;
                overflow-y: auto;
                overflow-x: auto;
                white-space: pre-wrap;
                word-break: break-word;
            }

            .output-content.active {
                display: block;
                text-wrap-mode: nowrap;
            }

            /* 控制面板样式 */
            .control-panel {
                grid-column: 1 / -1;
                margin-top: 20px;
            }

            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 15px;
                justify-content: center;
            }

            .btn {
                padding: 12px 28px;
                border-radius: 8px;
                border: none;
                font-family: 'Inter', sans-serif;
                font-weight: 600;
                font-size: 16px;
                cursor: pointer;
                transition: all 0.3s;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }

            .btn-primary {
                background: linear-gradient(135deg, var(--primary), var(--secondary));
                color: white;
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
            }

            .btn-secondary {
                background: rgba(255, 255, 255, 0.1);
                color: white;
                border: 1px solid rgba(255, 255, 255, 0.2);
            }

            .btn-secondary:hover {
                background: rgba(255, 255, 255, 0.15);
                transform: translateY(-2px);
            }


            .btn-warning {
                background: var(--warning);
                color: white;
            }


            /* 状态指示器 */
            .status-indicator {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 16px;
                background: rgba(30, 41, 59, 0.8);
                border-radius: 50px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                font-size: 14px;
            }

            .status-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--gray);
            }

            .status-dot.active {
                background: var(--success);
                animation: pulse 2s infinite;
            }

            @keyframes pulse {
                0% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
                100% {
                    opacity: 1;
                }
            }


            /* 响应式调整 */
            @media (max-width: 768px) {
                .main-content {
                    gap: 16px;
                }

                .panel-body {
                    padding: 16px;
                }

                .controls {
                    flex-direction: column;
                    align-items: stretch;
                }

                .btn {
                    width: 100%;
                }

                header {
                    flex-direction: column;
                    gap: 20px;
                    text-align: center;
                }

                .stats {
                    width: 100%;
                    justify-content: space-around;
                }
            }

            /* 底部信息 */
            footer {
                text-align: center;
                padding: 30px 0;
                margin-top: 40px;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
                color: var(--gray);
                font-size: 14px;
            }

            .footer-links {
                display: flex;
                justify-content: center;
                gap: 20px;
                margin-top: 15px;
            }

            .footer-link {
                color: var(--gray);
                text-decoration: none;
                transition: color 0.3s;
            }

            .footer-link:hover {
                color: var(--primary);
            }

            /* 滚动条样式 */
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }

            ::-webkit-scrollbar-track {
                background: rgba(255, 255, 255, 0.05);
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb {
                background: rgba(255, 255, 255, 0.2);
                border-radius: 4px;
            }

            ::-webkit-scrollbar-thumb:hover {
                background: rgba(255, 255, 255, 0.3);
            }

            .btn-check {
                position: absolute;
                clip: rect(0, 0, 0, 0);
                pointer-events: none;
            }
        </style>
    </head>

        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.3/ace.js"
            integrity="sha512-T2otaV2NuxAJAOCoj8ijyy+eAAadZlpvdLmakrIGVFbBkthgIFqLTXd+T8Z+S+kf4V7Ib5+6f6r4D4IdS9Ey4A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <script>
            function highlightIR(text) {
                const rules = [
                    { regex: /\s\|(\w+)\|\s/g, className: 'ir-operator' },
                    { regex: /([.@])(\w+)/g, className: 'ir-keyword' },
                    { regex: /\b(nil|true|false)\b/g, className: 'ir-literal' },
                    { regex: /\[(\d|,|\s)*]str/g, className: 'ir-string' },
                    { regex: /(R|Consts|UpVals)\[\d+]/g, className: 'ir-register' },
                    { regex: /\b\d+([if])?\b/g, className: 'ir-number' },
                    { regex: /\[\d+]/g, className: 'ir-line-number' },
                    { regex: /%.*%/g, className: 'ir-comment' },
                    { regex: /^(main|#\d+)/gm, className: 'ir-block-name' },
                    { regex: /^=+$/gm, className: 'ir-separator' },
                    { regex: /^-+$/gm, className: 'ir-separator' },
                    {
                        regex: /(params|vararg|consts|nesteds|coroutine)/g,
                        className: 'ir-metadata',
                    },
                    { regex: /<-|(\s:=\s)/g, className: 'ir-arrow' },
                    { regex: /^- (Consts|Nesteds):/gm, className: 'ir-label' },
                    { regex: /\.\.\./g, className: 'ir-vararg' },
                ]

                let result = text

                for (const rule of rules) {
                    result = result.replace(
                        rule.regex,
                        match => `<span class="${rule.className}">${match}</span>`,
                    )
                }

                return result
            }

            let compileCount = 0
            let percentCount = 0
            let currentSessionId = 1
            let isCompiling = false

            const codeEditorEl = document.getElementById('editor-container')
            const codeEditor = ace.edit(codeEditorEl, {
                mode: 'ace/mode/lua',
                selectionStyle: 'text',
                theme: 'ace/theme/monokai',
            })

            const compileBtn = document.getElementById('compile-btn')

            document.addEventListener('beforeunload', () => {
                localStorage.setItem('code', codeEditor.session.getValue())
            })
            document.addEventListener('DOMContentLoaded', () => {
                codeEditor.session.setValue(localStorage.getItem('code') || '')
            })

            document.getElementById('tokens');
            document.getElementById('ast');
            document.getElementById('ir');
            document.getElementById('bytecode');

            const astOutEditor = ace.edit('ast-tab-content', {
                mode: 'ace/mode/json',
                selectionStyle: 'text',
                theme: 'ace/theme/monokai',
            })
            astOutEditor.setReadOnly(true)

            const resetBtn = document.getElementById('reset-btn')
            const formatBtn = document.getElementById('format-btn')
            const clearOutputBtn = document.getElementById('clear-output-btn')
            const outputTabs = document.querySelectorAll('.output-tab')
            const outputContents = document.querySelectorAll('.output-content')
            const compileCountElement = document.getElementById('compile-count')
            const successRateElement = document.getElementById('success-rate')
            const sessionIdElement = document.getElementById('session-id')
            document.getElementById('optimize-checkbox');
            document.getElementById('warnings-checkbox');
            document.getElementById('target-select');

            const exampleCodes = {
                defines: `
            local a, b = ...
                        `,
            }

            async function compile(input, step) {
                const res = await fetch('/do', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        kind: step,
                        code: input,
                    }),
                })
                return await res.json()
            }

            function init() {
                updateStats()

                sessionIdElement.textContent = `#${currentSessionId.toString().padStart(3, '0')}`

                compileBtn.addEventListener('click', handleCompile)
                //lexicalBtn.addEventListener('click', handleLexicalAnalysis)
                //syntaxBtn.addEventListener('click', handleSyntaxAnalysis)
                //irBtn.addEventListener('click', handleIRGeneration)
                //asmBtn.addEventListener('click', handleAssemblyGeneration)
                resetBtn.addEventListener('click', handleReset)
                formatBtn.addEventListener('click', () => alert('棍木'))
                clearOutputBtn.addEventListener('click', handleClearOutput)

                outputTabs.forEach(tab => {
                    tab.addEventListener('click', () => {
                        const tabId = tab.getAttribute('data-tab')
                        switchTab(tabId)
                    })
                })
                showMessage('Duka Visual Tool 就绪')
            }

            function updateStats() {
                compileCountElement.textContent = compileCount
                const successRate =
                    compileCount > 0 ? Math.round((percentCount / compileCount) * 100) : 100
                successRateElement.textContent = `${successRate}%`
            }

            function switchTab(tabId) {
                outputTabs.forEach(tab => tab.classList.remove('active'))
                outputContents.forEach(content => content.classList.remove('active'))

                document.querySelector(`.output-tab[data-tab="${tabId}"]`).classList.add('active')
                document.getElementById(`${tabId}-tab-content`).classList.add('active')
            }

            function handleCompile() {
                if (isCompiling) return

                const code = codeEditor.session.getValue().trim()
                if (!code) {
                    showError('Empty')
                    return
                }

                isCompiling = true
                compileCount++
                currentSessionId++

                compileBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>Running...'
                compileBtn.disabled = true

                let who = document.querySelector(`input[name="expect"]:checked`)
                let pro
                switch (who.id) {
                    case 'tokens':
                        pro = handleTokens(code)
                        break
                    case 'ast':
                        pro = handleAST(code)
                        break
                    case 'ir':
                        pro = handleIR(code)
                        break
                    case 'bytecode':
                        pro = handleBytecode(code)
                        break
                }
                pro.then(() => {
                    percentCount++

                    updateStats()
                    sessionIdElement.textContent = `#${currentSessionId.toString().padStart(3, '0')}`

                    compileBtn.innerHTML = '<i class="fas fa-play-circle"></i>Run'
                    compileBtn.disabled = false
                    isCompiling = false
                })
            }

            async function handleTokens(code) {
                let response = await compile(code, 'lexical')

                if (response.status === 'success') {
                    const tokens = response.tokens.join('\n')
                    setOutputContent('tokens', tokens)
                    showMessage(`词法分析完成，共 ${response.count} 个 token`)
                } else {
                    showError(response.message || '词法分析失败')
                }

                switchTab('tokens')
            }

            async function handleAST(code) {
                let response = await compile(code, 'syntax')

                if (response.status === 'success') {
                    const ast = JSON.stringify(response.ast, null, 4)
                    astOutEditor.session.setValue(ast)
                    showMessage(`语法分析完成`)
                } else {
                    showError(response.message || '语法分析失败')
                }
                switchTab('ast')
            }

            async function handleIR(code) {
                let response = await compile(code, 'ir')

                if (response.status === 'success') {
                    const ir = response.ir
                    setOutputContent('ir', highlightIR(ir), true)
                    showMessage(`IR 生成完成`)
                } else {
                    showError(response.message || 'IR 生成失败')
                }
                switchTab('ir')
            }

            async function handleBytecode(code) {
                let response = await compile(code, 'asm')
                if (response.status === 'success') {
                    const asm = response.bytecode
                    setOutputContent('asm', asm)
                    showMessage(`字节码生成完成`)
                } else {
                    showError(response.message || '字节码生成失败')
                }
                switchTab('asm')
            }

            function handleReset() {
                if (confirm('确定重置?')) {
                    codeEditorEl.value = exampleCodes.defines
                    compileCount = 0
                    percentCount = 0
                    currentSessionId = 1

                    const outputIds = ['output', 'tokens', 'ast', 'ir', 'asm']
                    outputIds.forEach(id => {
                        const element = document.getElementById(`${id}-tab-content`)
                        element.innerHTML = `<div class="output-placeholder">
                                    <p>None</p>
                                </div>`
                    })

                    switchTab('output')

                    updateStats()
                    sessionIdElement.textContent = `#${currentSessionId.toString().padStart(3, '0')}`
                    showMessage('已重置')
                }
            }

            function handleClearOutput() {
                const activeTab = document
                    .querySelector('.output-tab.active')
                    .getAttribute('data-tab')
                const element = document.getElementById(`${activeTab}-tab-content`)
                element.innerHTML = `<div class="output-placeholder">
                            <p>NONE</p>
                        </div>`

                showMessage(`已清除${activeTab}输出`)
            }

            function setOutputContent(tabId, content, notPure) {
                const element = document.getElementById(`${tabId}-tab-content`)
                element.innerHTML = notPure ? content : `<pre>${content}</pre>`
            }

            function showMessage(message) {
                const statusInd = document.querySelector('.status-indicator')
                const statusDot = document.querySelector('.status-dot')
                const statusText = statusInd.querySelector('span:nth-child(2)')

                statusDot.className = 'status-dot active'
                statusText.textContent = message

                setTimeout(() => {
                    statusText.textContent = '编译器就绪'
                }, 5000)
            }

            function showError(message) {
                alert(message)
                const statusInd = document.querySelector('.status-indicator')
                const statusDot = document.querySelector('.status-dot')
                const statusText = statusInd.querySelector('span:nth-child(2)')

                statusDot.className = 'status-dot'
                statusDot.style.background = 'var(--danger)'
                statusText.textContent = message

                setTimeout(() => {
                    statusDot.style.background = ''
                    statusDot.className = 'status-dot active'
                    statusText.textContent = '编译器就绪'
                }, 3000)
            }

            window.addEventListener('DOMContentLoaded', init)
        </script>
    </body>
</html>
