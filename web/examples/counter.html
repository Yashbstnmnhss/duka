<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Duka Counter</title>
        <style>
            body {
                font-family: sans-serif;
                padding: 2rem;
            }
            .counter {
                text-align: center;
            }
            .counter h1 {
                margin: 0 0 1rem;
            }
            button {
                padding: 0.5rem 1rem;
                font-size: 1rem;
                cursor: pointer;
            }
            button:active {
                transform: scale(0.95);
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module">
            import { createApp } from './src/index.js'

            const app = await createApp({
                wasm: '../target/wasm32-unknown-unknown/release/duka_backend_wasm.wasm',
                modules: {
                    'src/main.duka': '../examples/src/main.duka',
                },
                entry: 'src/main.duka',
                args: [],
            })

            app.mount('#app').run()
        </script>
    </body>
</html>
