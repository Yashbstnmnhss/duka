name: Rust

on:
    push:
        branches: ['master']
    pull_request:
        branches: ['master']

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Format
              run: cargo fmt --all -- --check
            - name: Clippy
              run: cargo clippy --all-targets --all-features
            - name: Build
              run: cargo build --verbose
            # --no-fail-fast so a single failing binary cannot hide every other
            # result: without it a hard crash aborts the whole run, which turns
            # one broken test into an apparently failing suite.
            - name: Run tests
              run: cargo test --verbose --no-fail-fast
