[package]
name = "dukao"
description = "Test & package tools for duka"
authors = ["AogangSolang"]
version = "0.1.0"
edition = "2024"

[dependencies]
duka-lib = { path = "../lib" }
duka-app = { path = "../app" }
clap = { version = "4.5.48", features = ["derive"] }
serde_json = "1.0.148"
miette = { version = "7.6.0", features = ["fancy", "syntect-highlighter"]}
thiserror = "2.0.18"
syntect = "5.3.0"
rustyline = "17.0.2"
colored = "3.1.1"
