[package]
name = "duka-cli"
description = "Commandline interface compiler & runner for duka"
authors = ["AogangSolang"]
version = "0.1.8"
edition = "2024"

[dependencies]
duka-lib = { path = "../lib" }
duka-pipeline = { path = "../pipeline" }
duka-printer = { path = "../printer" }
clap = { version = "4.5.48", features = ["derive"] }
serde_json = "1.0.148"
miette = { version = "7.6.0", features = ["fancy", "syntect-highlighter"]}
thiserror = "2.0.18"
syntect = "5.3.0"
rustyline = "17.0.2"
colored = "3.1.1"
