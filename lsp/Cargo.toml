[package]
name = "duka-lsp"
version = "0.1.0"
edition = "2024"
authors = ["AogangSolang"]
description = "Language server for the Duka language"

[dependencies]
duka-frontend = { path = "../frontend" }
duka-shared = { path = "../shared" }
# The standard library metadata lives next to the implementations, and the
# analyzer is told what this build provides before the checker runs, so a hover
# and a diagnostic never disagree about it.
duka-lib = { path = "../lib" }
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
