[package]
name = "duka-lsp"
version = "0.1.0"
edition = "2024"
authors = ["AogangSolang"]
description = "Language server for the Duka language"

[dependencies]
# Everything the language server needs comes through here: the compiler, the
# metadata, and the declarations the runtime this build links against provides.
# One dependency, so the analyzer and the server cannot be built against
# different things.
duka-lib = { path = "../lib" }
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
