[package]
name = "duka-lsp"
version = "0.1.0"
edition = "2024"
authors = ["AogangSolang"]
description = "Language server for the Duka language"

[dependencies]
# Everything the language server needs comes through here: the compiler, the
# metadata, and the declarations the runtime this build links against provides.
# One dependency, so the analyzer and the server cannot be built against
# different things.
duka-lib = { path = "../lib" }
# Hover cards are documents too: the signature, the prose and the examples are
# rendered the same way the website's pages are.
duka-printer = { path = "../printer" }
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
# Only for the one request this server adds to the protocol: its parameters are a
# shape of its own, and deriving that shape is what says what it is.
serde = { version = "1", features = ["derive"] }
