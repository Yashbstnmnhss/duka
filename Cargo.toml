[workspace]
members = [
    "frontend",
    "backend",
    "backend-wasm",
    "app",
    "shared",
    "cli",
    "dukao",
    "macros",
    "gc",
    "pipeline",
    "printer",
    "lib",
    "lsp",
    "ffi"
]
resolver = "3"

[workspace.package]
repository = "https://github.com/Yashbstnmnhss/duka"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package.duka-frontend]
opt-level = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
